<style>
    html,
    body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #56a00f;
    }

    /* Fill the viewport at any screen size. Pinned with fixed/inset so page
       margins, scrollbars and ancestor layout can't shrink it. dvw/dvh follow
       the shrinking browser chrome on mobile; the vw/vh above are the
       fallback for browsers without dynamic viewport units. */
    #scene {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        width: 100dvw;
        height: 100dvh;
        display: block;
        z-index: 2000000;
        background: #56a00f;
    }

    /* The stadium keeps its aspect ratio and is cropped instead of
       letterboxed (preserveAspectRatio="xMidYMid slice" on the svg), so there
       are never bars on ultrawide or tall/phone screens. */

    /* ---------- the bounce ----------
       The ball art sits at roughly 1014,647 in the 1920x1080 viewBox, resting
       on the near hash marks. Every animation below is an offset from there,
       so the artwork itself never moved.

       The motion is split across nested groups so each axis can run on its own
       curve; multiplied together they read as an irregular, physical bounce
       rather than one sine-y hop:

         #football   translateX  - travel across the field, 12s, linear
           .bounce   translateY  - hops of differing heights, 12s
             .squash scale       - landing squash x perspective size, 12s
               .spin rotate      - 3.4s end-over-end tumble

       The X and Y tracks share the same 12s cycle and the same contact
       percentages - 0 11 20 32 39 52 60 74 84 92 100 - so the ball is always
       at ground level exactly when it has travelled to its landing spot. Both
       tracks start and end on identical values, so the loop closes with no
       jump. */
    #football {
        animation: ball-x 12s linear infinite;
        will-change: transform;
    }

    /* Distances between contacts all differ, and the ball kicks back off the
       far side of the field at 52%, so no two hops cover the same ground. */
    @keyframes ball-x {
        0% {
            transform: translateX(-760px);
        }

        11% {
            transform: translateX(-520px);
        }

        20% {
            transform: translateX(-300px);
        }

        32% {
            transform: translateX(90px);
        }

        39% {
            transform: translateX(330px);
        }

        52% {
            transform: translateX(690px);
        }

        60% {
            transform: translateX(430px);
        }

        74% {
            transform: translateX(60px);
        }

        84% {
            transform: translateX(-260px);
        }

        92% {
            transform: translateX(-540px);
        }

        100% {
            transform: translateX(-760px);
        }
    }

    /* Two things happen on this track at once. The contact values are not all
       zero - they drift between -35px and +110px so the ball lands further up
       or further down the field each time, which is what keeps it wandering
       "around" the field instead of along a single line. The apex values are
       those baselines minus a hop height, and no two hops are the same.

       Apex keyframes are ease-in (accelerating fall), contact keyframes are
       ease-out (decelerating rise) - that pairing is what sells gravity. Peak
       heights deliberately do not decay, so the loop never looks like a ball
       settling down to rest. */
    .bounce {
        animation: ball-y 12s infinite;
        will-change: transform;
    }

    @keyframes ball-y {
        0% {
            transform: translateY(70px);
            animation-timing-function: cubic-bezier(.28, .82, .58, 1);
        }

        5.5% {
            transform: translateY(-260px);
            animation-timing-function: cubic-bezier(.45, 0, .75, .2);
        }

        11% {
            transform: translateY(10px);
            animation-timing-function: cubic-bezier(.28, .82, .58, 1);
        }

        15.5% {
            transform: translateY(-175px);
            animation-timing-function: cubic-bezier(.45, 0, .75, .2);
        }

        20% {
            transform: translateY(-30px);
            animation-timing-function: cubic-bezier(.28, .82, .58, 1);
        }

        26% {
            transform: translateY(-245px);
            animation-timing-function: cubic-bezier(.45, 0, .75, .2);
        }

        32% {
            transform: translateY(40px);
            animation-timing-function: cubic-bezier(.28, .82, .58, 1);
        }

        35.5% {
            transform: translateY(-60px);
            animation-timing-function: cubic-bezier(.45, 0, .75, .2);
        }

        39% {
            transform: translateY(100px);
            animation-timing-function: cubic-bezier(.28, .82, .58, 1);
        }

        45.5% {
            transform: translateY(-230px);
            animation-timing-function: cubic-bezier(.45, 0, .75, .2);
        }

        52% {
            transform: translateY(20px);
            animation-timing-function: cubic-bezier(.28, .82, .58, 1);
        }

        56% {
            transform: translateY(-182px);
            animation-timing-function: cubic-bezier(.45, 0, .75, .2);
        }

        60% {
            transform: translateY(-35px);
            animation-timing-function: cubic-bezier(.28, .82, .58, 1);
        }

        67% {
            transform: translateY(-230px);
            animation-timing-function: cubic-bezier(.45, 0, .75, .2);
        }

        74% {
            transform: translateY(55px);
            animation-timing-function: cubic-bezier(.28, .82, .58, 1);
        }

        79% {
            transform: translateY(-67px);
            animation-timing-function: cubic-bezier(.45, 0, .75, .2);
        }

        84% {
            transform: translateY(110px);
            animation-timing-function: cubic-bezier(.28, .82, .58, 1);
        }

        88% {
            transform: translateY(-195px);
            animation-timing-function: cubic-bezier(.45, 0, .75, .2);
        }

        92% {
            transform: translateY(30px);
            animation-timing-function: cubic-bezier(.28, .82, .58, 1);
        }

        96% {
            transform: translateY(-65px);
            animation-timing-function: cubic-bezier(.45, 0, .75, .2);
        }

        100% {
            transform: translateY(70px);
        }
    }

    /* Scale carries two jobs folded into one track, because both are plain
       non-rotating scales on the same group:

       1. Perspective. The ball lands nearer the camera (larger) or further up
          the field (smaller) - the factor tracks the landing baseline in
          ball-y above, 1.10 at the nearest landing down to 0.97 at the
          furthest.
       2. Landing squash. Only at the contact percentages, and only a frame or
          two wide - the plateau keyframes on either side hold the plain
          perspective value so the deformation reads as a quick pop against
          the turf rather than a constant pulsing. Harder landings (off the
          26%, 45.5% and 67% peaks) squash the most.

       This group sits OUTSIDE .spin on purpose: the flatten has to happen
       along the screen's vertical axis no matter which way the ball is
       pointing mid-tumble. transform-box: fill-box puts the origin on the
       ball's own bounding box instead of the viewBox origin. */
    .squash {
        transform-box: fill-box;
        transform-origin: center;
        animation: ball-scale 12s infinite;
    }

    @keyframes ball-scale {
        0% { transform: scale(1.230, 0.912); }
        1.8% { transform: scale(1.058, 1.058); }
        5.5% { transform: scale(1.035, 1.035); }
        9.2% { transform: scale(1.012, 1.012); }
        11% { transform: scale(1.212, 0.808); }
        12.8% { transform: scale(1.008, 1.008); }
        15.5% { transform: scale(0.990, 0.990); }
        18.2% { transform: scale(0.974, 0.974); }
        20% { transform: scale(1.096, 0.844); }
        21.8% { transform: scale(0.968, 0.968); }
        26% { transform: scale(1.005, 1.005); }
        30.2% { transform: scale(1.036, 1.036); }
        32% { transform: scale(1.290, 0.790); }
        33.8% { transform: scale(1.044, 1.044); }
        35.5% { transform: scale(1.065, 1.065); }
        37.2% { transform: scale(1.086, 1.086); }
        39% { transform: scale(1.199, 0.981); }
        40.8% { transform: scale(1.088, 1.088); }
        45.5% { transform: scale(1.055, 1.055); }
        50.2% { transform: scale(1.018, 1.018); }
        52% { transform: scale(1.285, 0.755); }
        53.8% { transform: scale(1.022, 1.022); }
        56% { transform: scale(0.995, 0.995); }
        58.2% { transform: scale(0.972, 0.972); }
        60% { transform: scale(1.106, 0.834); }
        61.8% { transform: scale(0.968, 0.968); }
        67% { transform: scale(1.010, 1.010); }
        72.2% { transform: scale(1.046, 1.046); }
        74% { transform: scale(1.281, 0.819); }
        75.8% { transform: scale(1.052, 1.052); }
        79% { transform: scale(1.075, 1.075); }
        82.2% { transform: scale(1.098, 1.098); }
        84% { transform: scale(1.287, 0.913); }
        85.8% { transform: scale(1.102, 1.102); }
        88% { transform: scale(1.065, 1.065); }
        90.2% { transform: scale(1.028, 1.028); }
        92% { transform: scale(1.112, 0.948); }
        93.8% { transform: scale(1.032, 1.032); }
        96% { transform: scale(1.045, 1.045); }
        98.2% { transform: scale(1.058, 1.058); }
        100% { transform: scale(1.230, 0.912); }
    }

    /* 3.4s against the 12s cycle: 12/3.4 is not a whole number, so the tumble
       never re-syncs with the hops and the ball lands on a different face
       every time. Single biggest contributor to the motion reading as
       irregular over a long watch. */
    .spin {
        transform-box: fill-box;
        transform-origin: center;
        animation: ball-spin 3.4s linear infinite;
    }

    @keyframes ball-spin {
        from {
            transform: rotate(0deg);
        }

        to {
            transform: rotate(360deg);
        }
    }

    /* ---------- ground shadow ----------
       The only element added to the artwork. Shares the X track exactly (same
       keyframes, same duration, same start time) so it stays planted under the
       ball, while its own track follows the landing baseline and tightens and
       darkens on contact, spreading out and fading as the ball climbs. */
    #ball-shadow {
        animation: ball-x 12s linear infinite;
    }

    #ball-shadow ellipse {
        transform-box: fill-box;
        transform-origin: center;
        animation: shadow-throb 12s infinite;
    }

    @keyframes shadow-throb {
        0% { transform: translateY(70px) scale(1.06); opacity: .30; }
        5.5% { transform: translateY(40px) scale(.52); opacity: .10; }
        11% { transform: translateY(10px) scale(1.01); opacity: .30; }
        15.5% { transform: translateY(-10px) scale(.66); opacity: .16; }
        20% { transform: translateY(-30px) scale(.97); opacity: .30; }
        26% { transform: translateY(5px) scale(.54); opacity: .10; }
        32% { transform: translateY(40px) scale(1.04); opacity: .30; }
        35.5% { transform: translateY(70px) scale(.78); opacity: .21; }
        39% { transform: translateY(100px) scale(1.09); opacity: .30; }
        45.5% { transform: translateY(60px) scale(.55); opacity: .11; }
        52% { transform: translateY(20px) scale(1.02); opacity: .30; }
        56% { transform: translateY(-8px) scale(.65); opacity: .16; }
        60% { transform: translateY(-35px) scale(.97); opacity: .30; }
        67% { transform: translateY(10px) scale(.56); opacity: .11; }
        74% { transform: translateY(55px) scale(1.05); opacity: .30; }
        79% { transform: translateY(82px) scale(.80); opacity: .22; }
        84% { transform: translateY(110px) scale(1.10); opacity: .30; }
        88% { transform: translateY(70px) scale(.62); opacity: .14; }
        92% { transform: translateY(30px) scale(1.03); opacity: .30; }
        96% { transform: translateY(50px) scale(.82); opacity: .23; }
        100% { transform: translateY(70px) scale(1.06); opacity: .30; }
    }

    /* Anyone who has asked the OS to calm animations down gets the still
       stadium with the ball sitting on the turf. */
    @media (prefers-reduced-motion: reduce) {

        #football,
        .bounce,
        .squash,
        .spin,
        #ball-shadow,
        #ball-shadow ellipse {
            animation: none;
        }

        #ball-shadow {
            display: none;
        }
    }
</style>
