        background-color: #fdf3df;
    }

    h1,
    h2,
    h3,
    h4 {
        font-family: "Open Sans";
    }



    #splashScreen {
        display: flex;
        justify-content: center;
        align-items: start;
        height: 100vh;
        width: 100vw;
        overflow: hidden;
    }
</style>
<style>
    #splashScreen svg {
        max-height: 600px;
        width: calc(100vw - 20px);
        height: calc(100vh - 20px);
    }

    /* ============================================================
       Master timeline: 6s loop
       0%  -> 10%  cap pops up off the bottle, spinning
       10% -> 23%  cap falls to the ground
       23% -> 47%  cap bounces twice and comes to rest
       47% -> 100% cap rests, then the whole sequence repeats
       ============================================================ */

    /* ---------- Bottle cap ---------- */
    #splashScreen #cap {
        transform-box: fill-box;
        transform-origin: center;
        animation: cap-pop-and-bounce 6s infinite;
    }

    @keyframes cap-pop-and-bounce {

        /* resting on the bottle */
        0% {
            transform: translate(0, 0) rotate(0deg);
            animation-timing-function: cubic-bezier(0.33, 0.66, 0.66, 1);
        }

        /* flips up off the bottle, rotating (decelerating as it rises) */
        10% {
            transform: translate(45px, -170px) rotate(220deg);
            animation-timing-function: cubic-bezier(0.33, 0, 0.66, 0.33);
        }

        /* falls to the ground (accelerating) */
        23% {
            transform: translate(150px, 548px) rotate(460deg);
            /* rise: fast off the ground, keeping a little speed through the apex */
            animation-timing-function: cubic-bezier(0.33, 0.66, 0.66, 0.94);
        }

        /* first bounce apex (velocity carries straight through, no hang) */
        27% {
            transform: translate(180px, 488px) rotate(535deg);
            /* fall: already moving at the apex, accelerating into the ground */
            animation-timing-function: cubic-bezier(0.33, 0.06, 0.66, 0.33);
        }

        /* first bounce down */
        31% {
            transform: translate(212px, 548px) rotate(610deg);
            animation-timing-function: cubic-bezier(0.33, 0.66, 0.66, 0.94);
        }

        /* second, smaller bounce apex */
        33.5% {
            transform: translate(232px, 528px) rotate(657deg);
            animation-timing-function: cubic-bezier(0.33, 0.06, 0.66, 0.33);
        }

        /* settles face down (720deg = two full spins, back to original orientation) */
        36% {
            transform: translate(258px, 548px) rotate(720deg);
        }

        /* rests until the loop restarts */
        100% {
            transform: translate(258px, 548px) rotate(720deg);
        }
    }

    /* ---------- Bottle rock ----------
       The pressure release from the cap popping knocks the bottle
       ajar: it rocks back and forth on its base, each swing smaller
       than the last, then settles. Pivots from bottom-center. */

    #splashScreen #full-bottle {
        transform-box: fill-box;
        transform-origin: 50% 100%;
        animation: bottle-rock 6s infinite ease-in-out;
    }

    @keyframes bottle-rock {

        /* still for the instant before the pop */
        0%,
        2% {
            transform: rotate(0deg);
        }

        /* recoil from the pop */
        5% {
            transform: rotate(2.2deg);
        }

        /* decaying swings */
        8.5% {
            transform: rotate(-1.7deg);
        }

        12% {
            transform: rotate(1.1deg);
        }

        15.5% {
            transform: rotate(-0.6deg);
        }

        18.5% {
            transform: rotate(0.25deg);
        }

        /* settled for the rest of the loop */
        21%,
        100% {
            transform: rotate(0deg);
        }
    }

    /* ---------- Bubbles ----------
       Each bubble rises and fades out on its own continuous loop.
       Durations divide evenly into the 6s master timeline so they
       stay in phase with the cap sequence, and the initial delays
       hold them still until the cap has popped off. */

    #splashScreen #bubbles circle {
        transform-box: fill-box;
        transform-origin: center;
        animation: bubble-rise 2s infinite ease-in;
        animation-delay: 0.7s;
    }

    @keyframes bubble-rise {
        0% {
            transform: translateY(0) scale(1);
            opacity: 1;
        }

        70% {
            opacity: 1;
        }

        100% {
            transform: translateY(-130px) scale(1.15);
            opacity: 0;
        }
    }

    /* stagger the bubbles so they don't all rise at once */
    #splashScreen #bubbles circle:nth-child(6n+1) {
        animation-duration: 2s;
        animation-delay: 0.7s;
    }

    #splashScreen #bubbles circle:nth-child(6n+2) {
        animation-duration: 3s;
        animation-delay: 1.3s;
    }

    #splashScreen #bubbles circle:nth-child(6n+3) {
        animation-duration: 1.5s;
        animation-delay: 0.9s;
    }

    #splashScreen #bubbles circle:nth-child(6n+4) {
        animation-duration: 2s;
        animation-delay: 1.7s;
    }

    #splashScreen #bubbles circle:nth-child(6n+5) {
        animation-duration: 3s;
        animation-delay: 0.8s;
    }

    #splashScreen #bubbles circle:nth-child(6n+6) {
        animation-duration: 1.5s;
        animation-delay: 1.5s;
    }

    /* ---------- Leaves ----------
       A gentle, natural rock as if a light breeze is rustling them.
       Left-side leaves pivot from their right edge (where they meet
       the bottle); right-side leaves pivot from their left edge.
       Negative delays desynchronize the sway so it feels organic. */

    #splashScreen #bg-leaves>g {
        transform-box: fill-box;
        animation: leaf-sway 3s infinite alternate ease-in-out;
    }

    #splashScreen #leaf-1,
    #splashScreen #leaf-2,
    #splashScreen #leaf-3,
    #splashScreen #leaf-7 {
        transform-origin: right center;
    }

    #splashScreen #leaf-4,
    #splashScreen #leaf-5,
    #splashScreen #leaf-6 {
        transform-origin: left center;
    }

    @keyframes leaf-sway {
        from {
            transform: rotate(-1.6deg);
        }

        to {
            transform: rotate(1.6deg);
        }
    }

    #splashScreen #leaf-1 {
        animation-duration: 2.8s;
        animation-delay: -0.4s;
    }

    #splashScreen #leaf-2 {
        animation-duration: 3.4s;
        animation-delay: -1.1s;
    }

    #splashScreen #leaf-3 {
        animation-duration: 3s;
        animation-delay: -2.2s;
    }

    #splashScreen #leaf-4 {
        animation-duration: 3.6s;
        animation-delay: -0.7s;
    }

    #splashScreen #leaf-5 {
        animation-duration: 2.9s;
        animation-delay: -1.8s;
    }

    #splashScreen #leaf-6 {
        animation-duration: 3.2s;
        animation-delay: -2.6s;
    }

    #splashScreen #leaf-7 {
        animation-duration: 3.3s;
        animation-delay: -1.4s;
    }
</style>
