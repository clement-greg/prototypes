<style>
    html,
    body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #0f3550;
    }

    /* Fill the viewport at any screen size. The artwork keeps its aspect
       ratio and is cropped rather than letterboxed (preserveAspectRatio
       "xMidYMid slice"), so the visible region is always inside x 0-1920. */
    #scene {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        width: 100dvw;
        height: 100dvh;
        display: block;
        z-index: 2000000;
        background: #0f3550;
    }

    /* ---------- wordmark ----------
       Candy cane fill for the Cogent letters: diagonal red and white bands
       (the #candy-cane pattern in the SVG defs), with a thin pink edge on
       each red band so it reads as painted sugar rather than flat tape.
       Overrides the artwork's light blue fill; the black outline stays. */
    #cogent-logo {
        fill: url(#candy-cane);
    }

    /* Barber-pole scroll. The stripes group inside the pattern tile slides
       one full stripe period (72 units) and repeats; it holds a copy of the
       stripe one period to the left, so every tile is always fully covered
       and the loop seam is invisible. Animating the tile's contents rather
       than the <pattern> itself keeps it working everywhere -- CSS transform
       on a <pattern> element is not reliably supported. */
    #candy-cane-stripes {
        animation: candy-cane-scroll 8s linear infinite;
    }

    @keyframes candy-cane-scroll {
        from {
            transform: translateX(0);
        }

        to {
            transform: translateX(72px);
        }
    }

    /* ---------- train ----------
       The train (bbox x 1179-1892) starts fully off the right edge, runs off
       the left edge, flips and runs back. The flip happens while it is off
       screen, so it is never seen. The pivot is fixed in viewBox units at the
       train's centre (view-box, not fill-box) because the growing smoke puffs
       would otherwise move the group's box and make the pivot wander.
       Start: 1920 - 1179 + 20 = 761px. End: -(1892 + 20) = -1912px. */
    #train-and-smoke {
        transform-box: view-box;
        transform-origin: 1535px 800px;
        animation: train-run 20s linear infinite;
        will-change: transform;
    }

    @keyframes train-run {
        0% {
            transform: translateX(761px) scaleX(1);
        }

        49.999% {
            transform: translateX(-1912px) scaleX(1);
        }

        50% {
            transform: translateX(-1912px) scaleX(-1);
        }

        100% {
            transform: translateX(761px) scaleX(-1);
        }
    }

    /* A small chug so the engine feels like it is working. */
    #train {
        animation: train-chug 0.45s ease-in-out infinite alternate;
    }

    @keyframes train-chug {
        from {
            transform: translateY(0);
        }

        to {
            transform: translateY(-2px);
        }
    }

    /* ---------- wheels ----------
       The traced artwork has no wheel groups: each wheel's spokes, hub and
       shading are loose paths interleaved with the coupling rods and body,
       so regrouping them would change what draws over what. Instead every
       spinning piece is tagged with its wheel's class and rotated in place
       about that wheel's centre (view-box origin), keeping the original
       stacking: the rods, crossheads and body stay on top and stay still.
       The outer rims are left static -- they are round, so they look the
       same turning -- because they are split into arcs that would otherwise
       rotate away and leave gaps.

       The trace also has holes where the rods covered the spokes. A dark
       disc (.wheel-backing) sits under each wheel so those holes read as
       shadow rather than sky as they come around.

       Rolling without slipping at the train's speed (2673 units / 10s =
       ~267 units/s): front wheel r~41 -> 0.97s a turn, drivers r~57 ->
       1.34s a turn. Counter-clockwise while heading left; the group's
       scaleX(-1) flip reverses it automatically for the return run. */
    .wheel-backing {
        fill: #472a48;
    }

    .wheel {
        transform-box: view-box;
        animation: wheel-spin linear infinite;
    }

    .wheel-front {
        transform-origin: 1282px 935px;
        animation-duration: 0.97s;
    }

    .wheel-driver-1 {
        transform-origin: 1469px 917px;
        animation-duration: 1.34s;
    }

    .wheel-driver-2 {
        transform-origin: 1604.5px 917px;
        animation-duration: 1.34s;
    }

    .wheel-driver-3 {
        transform-origin: 1738px 919px;
        animation-duration: 1.34s;
    }

    @keyframes wheel-spin {
        from {
            transform: rotate(0deg);
        }

        to {
            transform: rotate(-360deg);
        }
    }

    /* ---------- rods ----------
       Like the wheels, the rods are loose traced paths, tagged in place so
       the stacking is unchanged. Two outlines in the trace merged a rod with
       the top of a driver's rim; each was split into a static rim copy and a
       moving rod copy using complementary clip paths (#rim-clip-*,
       #rod-clip-*). A rim-coloured ring (.rim-underlay) under each driver
       fills any sliver of rim the rods uncover as they move.

       All rod motion shares the drivers' 1.34s turn and starts with them, so
       it stays locked to the wheels. Crank throw R = 7 units -- small enough
       that each rod eye stays tucked under its hub cap.

       Coupling rods: every point follows the crank pin around a circle.
       rotate(a) translateX(R) rotate(-a) is a pure translation of
       R(cos a, sin a) whatever the origin, and interpolates as an exact
       circle, turning the same way as the wheels.

       Main rod: its wheel end follows the crank pin while its cylinder end
       rides the crosshead, which can only slide. So it slides R cos a and
       tips about the crosshead end by asin(R sin a / L), L ~ 58 units.
       Sampled every 15 degrees (cos/sin are not CSS-interpolable). */
    .rim-underlay {
        fill: none;
        stroke: #e8884a;
        stroke-width: 9px;
    }

    .rod {
        animation-duration: 1.34s;
        animation-timing-function: linear;
        animation-iteration-count: infinite;
    }

    .coupling-rod {
        animation-name: rod-orbit;
    }

    @keyframes rod-orbit {
        from {
            transform: rotate(0deg) translateX(7px) rotate(0deg);
        }

        to {
            transform: rotate(-360deg) translateX(7px) rotate(360deg);
        }
    }

    .main-rod {
        transform-box: view-box;
        transform-origin: 1399px 896px;
        animation-name: main-rod-drive;
    }

    @keyframes main-rod-drive {
        0% {
            transform: translateX(7.00px) rotate(0.00deg);
        }
        4.167% {
            transform: translateX(6.76px) rotate(-1.79deg);
        }
        8.333% {
            transform: translateX(6.06px) rotate(-3.46deg);
        }
        12.5% {
            transform: translateX(4.95px) rotate(-4.90deg);
        }
        16.667% {
            transform: translateX(3.50px) rotate(-6.00deg);
        }
        20.833% {
            transform: translateX(1.81px) rotate(-6.69deg);
        }
        25% {
            transform: translateX(0.00px) rotate(-6.93deg);
        }
        29.167% {
            transform: translateX(-1.81px) rotate(-6.69deg);
        }
        33.333% {
            transform: translateX(-3.50px) rotate(-6.00deg);
        }
        37.5% {
            transform: translateX(-4.95px) rotate(-4.90deg);
        }
        41.667% {
            transform: translateX(-6.06px) rotate(-3.46deg);
        }
        45.833% {
            transform: translateX(-6.76px) rotate(-1.79deg);
        }
        50% {
            transform: translateX(-7.00px) rotate(-0.00deg);
        }
        54.167% {
            transform: translateX(-6.76px) rotate(1.79deg);
        }
        58.333% {
            transform: translateX(-6.06px) rotate(3.46deg);
        }
        62.5% {
            transform: translateX(-4.95px) rotate(4.90deg);
        }
        66.667% {
            transform: translateX(-3.50px) rotate(6.00deg);
        }
        70.833% {
            transform: translateX(-1.81px) rotate(6.69deg);
        }
        75% {
            transform: translateX(-0.00px) rotate(6.93deg);
        }
        79.167% {
            transform: translateX(1.81px) rotate(6.69deg);
        }
        83.333% {
            transform: translateX(3.50px) rotate(6.00deg);
        }
        87.5% {
            transform: translateX(4.95px) rotate(4.90deg);
        }
        91.667% {
            transform: translateX(6.06px) rotate(3.46deg);
        }
        95.833% {
            transform: translateX(6.76px) rotate(1.79deg);
        }
        100% {
            transform: translateX(7.00px) rotate(0.00deg);
        }
    }

    .crosshead {
        animation-name: crosshead-slide;
    }

    @keyframes crosshead-slide {
        0% {
            transform: translateX(7.00px);
        }
        4.167% {

        }
        8.333% {

        }

        29.167% {

        }
        33.333% {

        41.667% {

        87.5% {

        }
        91.667% {

        }
        95.833% {
            transform: translateX(6.76px);
        }
        100% {
            transform: translateX(7.00px);
        }
    }

    /* ---------- smoke ----------
       Each puff is born small at the stack top (~1322, 618), rises, drifts
       back over the engine, grows and fades to nothing. The three puffs share
       one path but each has its own keyframes because their resting sizes and
       positions differ (translate is measured from each ellipse's own centre,
       scale from its own radius). Staggered by a third of the cycle so there
       is always one leaving, one rising and one being born. Keyframe spacing
       makes the puff shoot out quickly then slow as it billows. */
    #smoke-1,
    #smoke-2,
    #smoke-3 {
        transform-box: fill-box;
        transform-origin: center;
        animation-duration: 3s;
        animation-timing-function: linear;
        animation-iteration-count: infinite;
        opacity: 0;
    }

    #smoke-1 {
        animation-name: puff-smoke-1;
        animation-delay: -2s;
    }

    @keyframes puff-smoke-1 {
        0% {
            transform: translate(-169.8px, 206.0px) scale(0.088);
            opacity: 0;
        }

        6% {
            transform: translate(-168.8px, 188.0px) scale(0.196);

        }

        25% {

        }

            opacity: 0.65;
        }

        80% {

            opacity: 0.3;
        }

        100% {

            opacity: 0;
        }

    }

        }

        80% {

            opacity: 0.3;
        }

        100% {
            transform: translate(120.2px, -147.3px) scale(1.975);
            opacity: 0;
        }

    }

    #smoke-3 {
        animation-name: puff-smoke-3;

    }

    @keyframes puff-smoke-3 {
        0% {
            transform: translate(-8.0px, 29.1px) scale(0.315);

        }

        6% {

        80% {

    /* ---------- boy ----------
       A natural jump: crouch (anticipation squash), stretch on take-off, ease
       out to the apex, a brief hang, ease in on the way down, squash on
       landing and a little settle. The pivot is his feet (1382, 699) so the
       squash happens against the ground. Each segment carries its own easing
       (a keyframe's timing function applies to the segment that starts at
       it). His pupils run on the same clock: down while crouching, up as he
       rises, level at the apex, down watching for the ground. */
    #boy {
        transform-box: view-box;
        transform-origin: 1382px 699px;
        animation: boy-jump 2.6s infinite;
        will-change: transform;
    }

    @keyframes boy-jump {
        0% {
            transform: translateY(0) scale(1, 1) rotate(0deg);
            animation-timing-function: ease-in-out;
        }

        8.62% {
            transform: translateY(0) scale(1.07, 0.9) rotate(0deg);
            animation-timing-function: ease-out;
        }

        13.54% {
            transform: translateY(-14px) scale(0.95, 1.08) rotate(-1.5deg);
            animation-timing-function: cubic-bezier(0.2, 0.7, 0.4, 1);
        }

        28.31% {
            transform: translateY(-80px) scale(1, 1) rotate(-0.5deg);
            animation-timing-function: ease-in-out;
        }

        33.23% {
            transform: translateY(-78px) scale(1, 1) rotate(0.5deg);
            animation-timing-function: cubic-bezier(0.6, 0, 0.8, 0.3);
        }

        46.77% {
            transform: translateY(0) scale(0.97, 1.05) rotate(1.5deg);
            animation-timing-function: ease-out;
        }

        51.08% {
            transform: translateY(0) scale(1.08, 0.88) rotate(0deg);
            animation-timing-function: ease-in-out;
        }

        56.62% {
            transform: translateY(0) scale(0.98, 1.02) rotate(0deg);
            animation-timing-function: ease-in-out;
        }

        61.54%,
        100% {
            transform: translateY(0) scale(1, 1) rotate(0deg);
        }
    }

    #boy-right-pupil,
    #boy-left-pupil {
        animation: boy-look 2.6s ease-in-out infinite;
    }

    @keyframes boy-look {
        0%,

        }

        51.69% {

        }
    }

    /* ---------- snowman ----------
       Heavier and squishier than the boy: a slower hop, lower apex and much
       more squash -- he is made of snow. Offset in phase so the two never
       land together. Pivot is his base (529, 712). */
    #snowman {
        transform-box: view-box;
        transform-origin: 529px 712px;
        animation: snowman-hop 3.1s infinite;
        animation-delay: -0.8s;
        will-change: transform;

    }

    /* ---------- stars ----------
       A subtle twinkle: each star stretches a touch one way, then the other,
       with a slight turn and a small dip in brightness. Per-star amounts,
       speeds and phases so the sky never pulses in unison. */
    .star {
        transform-box: fill-box;
        transform-origin: center;
        animation-name: twinkle;
        animation-timing-function: ease-in-out;
        animation-iteration-count: infinite;
    }

    @keyframes twinkle {

            opacity: 1;
        }

        30% {
            transform: scale(var(--tw-a), var(--tw-b)) rotate(var(--tw-r));
            opacity: var(--tw-o);
        }

        65% {
            transform: scale(var(--tw-b), var(--tw-a)) rotate(calc(var(--tw-r) * -1));
            opacity: 1;
        }
    }
