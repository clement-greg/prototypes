<style>
    #splashScreen svg {
        max-height: 600px;
        width: calc(100vw - 20px);
        height: calc(100vh - 20px);

    /* Trace the chalk writing: measured path length is ~2128 user units */
    #cogent-writing {
        stroke-dasharray: 2140;
        stroke-dashoffset: 2140;
        animation: cogent-writing-trace 4s linear 0.4s infinite;
    }

    @keyframes cogent-writing-trace {
        0% {
            stroke-dashoffset: 2140;
        }

        75%,
        100% {
            stroke-dashoffset: 0;
        }
    }

    /* Paper airplane glides left -> right across the board.
       It starts at x 24.7-174.8, just left of the chalkboard clip (x 206.4-911.1),
       so it enters and exits the visible board purely via translateX. */
    #paper-air-plane {
        transform-box: fill-box;
        transform-origin: center;
        animation: paper-air-plane-flight 3.5s linear 1s infinite;
    }

    /* Sampled every 4% off a smooth glide curve (two overlapping sine swoops), with the
       rotation taken from the curve's slope at each sample, so linear interpolation between
       keyframes still reads as a continuous arc and the nose always points along the path.

       scale() comes last, so it acts in the plane's own rotated frame: scaleX is along the
       flight axis. It's driven by the same slope as the rotation -- nose-down/diving stretches
       the plane along its axis (picking up speed), climbing squashes it (bleeding speed) -- and
       scaleY is the reciprocal of scaleX so the apparent area stays constant. */
    @keyframes paper-air-plane-flight {
        0% {
            transform: translate(0px, 11.6px) rotate(-6.6deg) scale(0.968, 1.033);
        }

        4% {
            transform: translate(37px, 4.7px) rotate(-14.7deg) scale(0.927, 1.079);
        }

        8% {
            transform: translate(74px, -7px) rotate(-19.4deg) scale(0.901, 1.11);
        }

        12% {
            transform: translate(111px, -19.7px) rotate(-17deg) scale(0.914, 1.094);
        }

        16% {
            transform: translate(148px, -28px) rotate(-7.1deg) scale(0.965, 1.036);
        }

        20% {
            transform: translate(185px, -28.2px) rotate(6.4deg) scale(1.032, 0.969);
        }

        24% {
            transform: translate(222px, -20.4px) rotate(16.1deg) scale(1.081, 0.925);
        }

        28% {
            transform: translate(259px, -8.6px) rotate(17.9deg) scale(1.091, 0.917);
        }

        32% {
            transform: translate(296px, 1.8px) rotate(12.6deg) scale(1.063, 0.941);
        }

        36% {
            transform: translate(333px, 7.3px) rotate(4deg) scale(1.02, 0.981);
        }

        40% {
            transform: translate(370px, 7.6px) rotate(-2deg) scale(0.99, 1.01);
        }

        44% {
            transform: translate(407px, 6px) rotate(-1.9deg) scale(0.991, 1.01);
        }

        48% {
            transform: translate(444px, 6.2px) rotate(2.9deg) scale(1.014, 0.986);
        }

        52% {
            transform: translate(481px, 9.8px) rotate(7.5deg) scale(1.037, 0.964);
        }

        56% {
            transform: translate(518px, 14.8px) rotate(6.9deg) scale(1.034, 0.967);
        }

        60% {
            transform: translate(555px, 17.3px) rotate(-0.5deg) scale(0.997, 1.003);
        }

        64% {
            transform: translate(592px, 13.3px) rotate(-11.6deg) scale(0.942, 1.061);
        }

        68% {
            transform: translate(629px, 2.6px) rotate(-19.8deg) scale(0.899, 1.112);
        }

        72% {
            transform: translate(666px, -11.7px) rotate(-20.9deg) scale(0.893, 1.12);
        }

        76% {
            transform: translate(703px, -23.7px) rotate(-14deg) scale(0.93, 1.075);
        }

        80% {
            transform: translate(740px, -29px) rotate(-1.7deg) scale(0.992, 1.008);
        }

        84% {
            transform: translate(777px, -26.2px) rotate(9.3deg) scale(1.046, 0.956);
        }

        88% {
            transform: translate(814px, -18.3px) rotate(13.7deg) scale(1.068, 0.936);
        }

        92% {
            transform: translate(851px, -9.9px) rotate(11.1deg) scale(1.055, 0.948);
        }

        96% {
            transform: translate(888px, -4.5px) rotate(5.2deg) scale(1.025, 0.975);
        }

        100% {
            transform: translate(925px, -2.7px) rotate(1.4deg) scale(1.007, 0.993);
        }
    }

    /* Backpack falls onto the imaginary surface, squashes on impact, then rebounds in
       decaying hops back to its resting shape. Both elements pivot/scale from
       50% 100% -- the bottom of their own bbox -- so the base stays planted on the
       surface while the squash compresses the body downward.

       The drop is 200px, so the fall takes 0.52s (fall time goes with the square root of the
       height) and the bounce heights and squash scale with it. Percentages are shares of an
       8s cycle: fall 0-6.5%, bounces settle by 15.4%, rest until 93.8%.

       A 200px start sits on-screen, so restarting the cycle straight from it would show the
       backpack pop upward every 8s. Instead the last 0.5s (93.8-100%) lifts it smoothly back
       to the start height, which makes the loop seamless and reads as anticipation before
       the next drop. To lose the lift and accept a visible reset instead, delete the 93.8%
       keyframe and put translateY(-200px) on 100%.

       Impact lands at 6.5% of a cycle that starts at 0.2s => 0.72s on the timeline.
       #apple's delay is set to exactly that so its rock begins on the impact frame, and it
       shares the 8s period so the two stay locked together on every repeat. */
    #backpack {
        transform-box: fill-box;
        transform-origin: 50% 100%;
        animation: backpack-drop 8s 0.2s infinite both;
    }

    @keyframes backpack-drop {

        /* free fall -- accelerating, so the ease is on the outgoing segment */
        0% {
            transform: translateY(-200px) scale(1, 1);
            animation-timing-function: cubic-bezier(0.5, 0, 1, 0.5);
        }

        6.5% {
            transform: translateY(0) scale(1, 1);
            animation-timing-function: ease-out;
        }

        /* impact: compresses down onto the surface */
        7.6% {
            transform: translateY(0) scale(1.11, 0.89);
            animation-timing-function: ease-out;
        }

        /* rebound: stretches as it leaves the surface */
        8.9% {
            transform: translateY(-17px) scale(0.96, 1.05);
            animation-timing-function: ease-in;
        }

        10.3% {
            transform: translateY(0) scale(1.05, 0.95);
            animation-timing-function: ease-out;
        }

        11.7% {
            transform: translateY(-6px) scale(0.985, 1.015);
            animation-timing-function: ease-in;
        }

        13.1% {
            transform: translateY(0) scale(1.02, 0.98);
            animation-timing-function: ease-out;
        }

        14.3% {
            transform: translateY(-2px) scale(0.995, 1.005);
            animation-timing-function: ease-in;
        }

        /* at rest, and held there through to the lift */
        15.4%,
        93.8% {
            transform: translateY(0) scale(1, 1);
            animation-timing-function: ease-in-out;
        }

        /* lifted back to the start height so the next cycle continues from here */
        100% {
            transform: translateY(-200px) scale(1, 1);
        }
    }

    /* Knocked loose by the impact, the apple tips away from the backpack (which sits to its
       left, hence the first swing is clockwise) and the swings decay to a dead stop.
       Same 8s period as the drop, delayed to the impact frame: the 2s of rocking occupies
       0-25% of the cycle and the rest holds at 0deg. Resting state == the 0% state, so the
       loop restart is seamless here. Swing amplitudes track the impact strength, which goes
       with the square root of the drop height. */
    #apple {
        transform-box: fill-box;
        transform-origin: 50% 100%;
        animation: apple-rock 8s ease-in-out 0.72s infinite both;
    }

    @keyframes apple-rock {
        0% {
            transform: rotate(0deg);
        }

        2% {
            transform: rotate(2deg);
        }

        5.5% {
            transform: rotate(-1.4deg);
        }

        9% {
            transform: rotate(1deg);
        }

        12.5% {
            transform: rotate(-0.65deg);
        }

        16% {
            transform: rotate(0.4deg);
        }

        19.5% {
            transform: rotate(-0.25deg);
        }

        22.5% {
            transform: rotate(0.12deg);
        }

        25%,
        100% {
            transform: rotate(0deg);
        }
    }

    /* The same impact jolts the pencil jar. The jar hops a little, and its loose contents --
       four pencils and the ruler -- hop higher and take longer to settle, since nothing is
       holding them down. Both are animated as translateY only (glass shouldn't squash), on
       the same 8s period, delayed to the 0.72s impact frame.

       #pencils is the group wrapping BOTH the jar and its contents, so it can't be the
       target: the contents are the four #pencil-* groups plus #ruler, and #jar moves
       separately. The jar's artwork is drawn after the contents, so its front wall hides the
       pencil ends -- at these hop heights (16px max, against a rim ~60px above the pencil
       tips) nothing lifts far enough to peek out over the rim. */
    #jar {
        transform-box: fill-box;
        transform-origin: 50% 100%;
        animation: jar-jolt 8s 0.72s infinite both;
    }

    @keyframes jar-jolt {
        0% {
            transform: translateY(0);
            animation-timing-function: ease-out;
        }

        1.6% {
            transform: translateY(-7px);
            animation-timing-function: ease-in;
        }

        3.3% {
            transform: translateY(0);
            animation-timing-function: ease-out;
        }

        4.3% {
            transform: translateY(-2px);
            animation-timing-function: ease-in;
        }

        5.3% {
            transform: translateY(0);
            animation-timing-function: ease-out;
        }

        5.9% {
            transform: translateY(-0.5px);
            animation-timing-function: ease-in;
        }

        6.5%,
        100% {
            transform: translateY(0);
        }
    }

    #pencil-1,
    #pencil-2,
    #pencil-3,
    #pencil-4,
    #ruler {
        transform-box: fill-box;
        transform-origin: 50% 100%;
        animation: pencils-jolt 8s 0.72s infinite both;
    }

    @keyframes pencils-jolt {
        0% {
            transform: translateY(0);
            animation-timing-function: ease-out;
        }

        2% {
            transform: translateY(-16px);
            animation-timing-function: ease-in;
        }

        4.3% {
            transform: translateY(0);
            animation-timing-function: ease-out;
        }

        5.5% {
            transform: translateY(-6px);
            animation-timing-function: ease-in;
        }

        6.8% {
            transform: translateY(0);
            animation-timing-function: ease-out;
        }

        7.6% {
            transform: translateY(-2px);
            animation-timing-function: ease-in;
        }

        8.5% {
            transform: translateY(0);
            animation-timing-function: ease-out;
        }

        9.1% {
            transform: translateY(-0.6px);
            animation-timing-function: ease-in;
        }

        9.8%,
        100% {
            transform: translateY(0);
        }
    }

    /* The book stack pops up too, but it's the heaviest thing on the desk: a smaller hop than
       the pencils, and it lands slightly off-balance, so it rocks side to side on its bottom
       edge for about a second afterwards. The wobble outlasts the hop -- the last few swings
       happen with the stack already back down. Same 8s period and 0.72s impact delay. */
    #books {
        transform-box: fill-box;
        transform-origin: 50% 100%;
        animation: books-jolt 8s 0.72s infinite both;
    }

    @keyframes books-jolt {
        0% {
            transform: translateY(0) rotate(0deg);
            animation-timing-function: ease-out;
        }

        1.6% {
            transform: translateY(-9px) rotate(0.8deg);
            animation-timing-function: ease-in;
        }

        /* back down, tipping the other way */
        3.5% {
            transform: translateY(0) rotate(-1.2deg);
            animation-timing-function: ease-out;
        }

        5% {
            transform: translateY(-3px) rotate(0.9deg);
            animation-timing-function: ease-in;
        }

        6.5% {
            transform: translateY(0) rotate(-0.7deg);
            animation-timing-function: ease-out;
        }

        7.8% {
            transform: translateY(-1px) rotate(0.45deg);
            animation-timing-function: ease-in;
        }

        /* settled -- the remaining swings are the stack rocking in place */
        9% {
            transform: translateY(0) rotate(-0.3deg);
            animation-timing-function: ease-in-out;
        }

        10.3% {
            transform: translateY(0) rotate(0.18deg);
            animation-timing-function: ease-in-out;
        }

        11.5% {
            transform: translateY(0) rotate(-0.1deg);
            animation-timing-function: ease-in-out;
        }

        12.5%,
        100% {
            transform: translateY(0) rotate(0deg);
        }
    }

    @media (prefers-reduced-motion: reduce) {
        #cogent-writing {
            stroke-dashoffset: 0;
            animation: none;
        }

        #paper-air-plane {
            /* park it inside the board instead of animating it in */
            transform: translate(400px, 0);
            animation: none;
        }

        /* these all already end at their resting state, so just show that */
        #backpack,
        #apple,
        #jar,
        #books,
        #pencil-1,
        #pencil-2,
        #pencil-3,
        #pencil-4,
        #ruler {
            transform: none;
            animation: none;
        }
    }
</style>
