<style>
    html,
    body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #28235d;
    }

    /* Fill the viewport at any screen size. Pinned with fixed/inset so page
       margins, scrollbars and ancestor layout can't shrink it. dvw/dvh follow
       the shrinking browser chrome on mobile; the vw/vh above are the
       fallback for browsers without dynamic viewport units. */
    #scene {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        width: 100dvw;
        height: 100dvh;
        display: block;
        z-index: 2000000;
        background: #28235d;
    }

    /* The artwork keeps its aspect ratio and is cropped instead of letterboxed
       (preserveAspectRatio="xMidYMid slice" on the svg below), so there are
       never bars on ultrawide or tall/phone screens. */

    /* ---------- birds: gentle flapping loop ----------
       Both poses are normalized to the same command structure (M + 24 C + Z), cut at matching arc-length positions,
       so the browser can interpolate `d` smoothly; `alternate` reverses the
       morph each cycle for a soft up/down glide rather than a snap-back. */
    .bird {
        animation: bird-flap 1.2s ease-in-out infinite alternate;
        will-change: d;
    }

    /* Staggered durations + negative delays so the flock never beats in
       unison; each bird is already mid-cycle on the first frame. */
    #bird-1 .bird {
        animation-duration: 1.1s;
        animation-delay: -0.95s;
    }

    #bird-2 .bird {
        animation-duration: 1.45s;
        animation-delay: -0.7s;
    }

    #bird-3 .bird {
        animation-duration: 1.3s;
        animation-delay: -0.4s;
    }

    /* ---------- flight: each bird traces its own closed loop ----------
       Offsets are relative to the bird's home position, and the last stop
       repeats the first, so the loop closes with no jump. linear timing
       keeps the drift even rather than pausing at each keyframe. */

        animation: flight-1 26s linear infinite;
    }

    @keyframes flight-1 {

        }

        }

        }

        93.75% {
            transform: translate(-44.01px, -15.56px);
        }

        100% {
            transform: translate(0px, 0px);
        }
    }

    #bird-3 .flight {
        animation: flight-3 21s linear infinite;
    }

    @keyframes flight-3 {
        0% {
            transform: translate(0px, 0px);
        }

        6.25% {

    /* ---------- tractor ----------
       Three nested groups so the transforms never fight: #tractor drives,
       .tractor-bounce takes the vertical jolts, .tractor-rock tips the body.
       The tractor is drawn facing left, so the leftward leg is forward; it
       flips with scaleX(-1) during the off-screen pause and drives back.
       transform-origin on an SVG group resolves to 0 0, so scaleX(-1) mirrors
       about the viewBox's LEFT EDGE, not the tractor -- which is why the
       return leg's offsets (1450 -> 3830) look nothing like the outbound
       leg's (420 -> -1960). Both legs still cover 2380 units, so the speed
       matches and the tyre gearing stays honest. Every flip lands while the
       tractor is fully off-screen, so the mirror is never seen. */
    #tractor {
        animation: tractor-drive 44s linear infinite;
    }

    @keyframes tractor-drive {
        0% {
            transform: translateX(420px) scaleX(1);
        }

        46% {
            transform: translateX(-1960px) scaleX(1);
        }

        50% {
            transform: translateX(1450px) scaleX(-1);
        }

        96% {
            transform: translateX(3830px) scaleX(-1);
        }

        100% {
            transform: translateX(420px) scaleX(1);
        }
    }

    /* Bounce and rock run on periods that don't divide into each other, so the
       ride never settles into a regular rhythm. */
    .tractor-bounce {
        animation: tractor-bounce 0.9s ease-in-out infinite;
    }

    @keyframes tractor-bounce {
        0% {
            transform: translateY(0);
        }

        22% {
            transform: translateY(-4.5px);
        }

        45% {
            transform: translateY(0);
        }

        62% {
            transform: translateY(-2px);
        }

        80% {
            transform: translateY(-0.5px);
        }

        100% {
            transform: translateY(0);
        }
    }

    .tractor-rock {
        transform-box: view-box;
        transform-origin: 1721px 940px;
        animation: tractor-rock 1.55s ease-in-out infinite alternate;
    }

    @keyframes tractor-rock {
        0% {
            transform: rotate(-1.3deg);
        }

        100% {
            transform: rotate(1.3deg);
        }
    }

    /* Treads spin about each wheel's measured centre. view-box keeps that
       origin in SVG user units, so the parent transforms don't drag it off. */
    #tire-1,
    #tire-2 {
        transform-box: view-box;
    }

    #tire-1 {
        transform-origin: 1790.6px 924.9px;
        animation: tire-roll 3.44s linear infinite;
    }

    #tire-2 {
        transform-origin: 1635.1px 956.7px;
        animation: tire-roll 1.8s linear infinite;
    }

    /* Negative rotation = rolling left; after the scaleX flip the mirror makes
       the same rotation read as rolling right, so one keyframe covers both. */
    @keyframes tire-roll {
        to {
            transform: rotate(-360deg);
        }
    }

    /* ---------- clouds: slow back-and-forth drift ----------
       Each sways around its drawn position (-A .. +A) with a little vertical
       wander mixed in, so the four never look like they share one rhythm.
       ease-in-out softens the turn at each end; the negative delays start
       every cloud at a different point in its sway. The high, distant clouds
       travel further and slower than the low ones. */
    #cloud-1 {
        animation: cloud-drift-1 24s ease-in-out -9s infinite;
    }

    #cloud-2 {
        animation: cloud-drift-2 29s ease-in-out -17s infinite;
    }

    #cloud-3 {
        animation: cloud-drift-3 41s ease-in-out -5s infinite;
    }

    #cloud-4 {
        animation: cloud-drift-4 34s ease-in-out -23s infinite;
    }

    @keyframes cloud-drift-1 {

        0%,
        100% {
            transform: translate(-14px, 0);
        }

        50% {
            transform: translate(14px, -3px);
        }
    }

    @keyframes cloud-drift-2 {

        0%,
        100% {
            transform: translate(-18px, 2px);
        }

        50% {
            transform: translate(18px, -2px);
        }
    }

    @keyframes cloud-drift-3 {

        0%,
        100% {
            transform: translate(-32px, 0);
        }

        50% {
            transform: translate(32px, -5px);
        }
    }

    @keyframes cloud-drift-4 {

        0%,
        100% {
            transform: translate(-26px, -4px);
        }

        50% {
            transform: translate(26px, 3px);
        }
    }

    @media (prefers-reduced-motion: reduce) {
        #tractor,
        .tractor-bounce,
        .tractor-rock,
        #tire-1,
        #tire-2,
        #cloud-1,
        #cloud-2,
        #cloud-3,
        #cloud-4,
        .bird,
        .flight {
            animation: none;
        }
    }
</style>
